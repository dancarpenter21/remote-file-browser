name: remote-workspace

x-files-environment: &files-environment
  RFB_ROOT: /fs-root
  RFB_ADMIN_USERNAME: "${FILES_ADMIN_USERNAME:-${RFB_ADMIN_USERNAME:-admin}}"
  RFB_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  RFB_SECURE_COOKIES: "${RWS_SECURE_COOKIES:-${RFB_SECURE_COOKIES:-true}}"
  RFB_CACHE_MAX_BYTES: "${FILES_CACHE_MAX_BYTES:-${RFB_CACHE_MAX_BYTES:-10737418240}}"
  RFB_CACHE_MAX_AGE_DAYS: "${FILES_CACHE_MAX_AGE_DAYS:-${RFB_CACHE_MAX_AGE_DAYS:-30}}"
  RFB_EDITOR_MAX_BYTES: "${FILES_EDITOR_MAX_BYTES:-${RFB_EDITOR_MAX_BYTES:-5242880}}"
  RFB_UPLOAD_MAX_BYTES: "${FILES_UPLOAD_MAX_BYTES:-${RFB_UPLOAD_MAX_BYTES:-42949672960}}"
  RFB_TERMINAL_ENABLED: "${FILES_TERMINAL_ENABLED:-${RFB_TERMINAL_ENABLED:-true}}"
  RFB_TERMINAL_SHELL: "${FILES_TERMINAL_SHELL:-${RFB_TERMINAL_SHELL:-/bin/zsh}}"
  RFB_TERMINAL_MAX_SESSIONS: "${FILES_TERMINAL_MAX_SESSIONS:-${RFB_TERMINAL_MAX_SESSIONS:-4}}"
  RFB_PROVENANCE_API_URL: http://files-provenance:8090
  FILES_VIDEO_STUDIO_URL: /apps/video/
  FILES_TEXT_EDITOR_URL: /apps/text/
  FILES_IMAGE_TOOLS_URL: /apps/images/
  RUST_LOG: "${RUST_LOG:-remote_file_browser=info,tower_http=info}"

services:
  files-server:
    image: remote-workspace-files-server
    build:
      context: ./apps/files/server
      args:
        FFMPEG_VERSION: "8.1.2"
        FFMPEG_SHA256: "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
    user: "${FILES_UID:-${RFB_UID:-1000}}:${FILES_GID:-${RFB_GID:-1000}}"
    working_dir: /fs-root
    environment: *files-environment
    volumes:
      - type: bind
        source: "${FILES_ROOT_PATH:-${RFB_ROOT_PATH:-${HOME}}}"
        target: /fs-root
        bind: { create_host_path: false }
    secrets: [admin_password]
    networks: [default, provenance-api]
    depends_on:
      files-provenance: { condition: service_healthy }
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp:size=512m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/rfb-healthcheck]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  files-provenance:
    image: remote-workspace-files-provenance
    build: { context: ./apps/files/provenance }
    environment:
      PROVENANCE_DB_HOST: provenance-db
      PROVENANCE_DB_NAME: rfb_provenance
      PROVENANCE_DB_USER: rfb_provenance
      PROVENANCE_DB_PASSWORD_FILE: /run/secrets/provenance_db_password
      RUST_LOG: "${RUST_LOG:-rfb_provenance_api=info}"
    secrets: [provenance_db_password]
    networks: [provenance-api, provenance-db]
    depends_on:
      provenance-db: { condition: service_healthy }
    expose: ["8090"]
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8090/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  provenance-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: rfb_provenance
      POSTGRES_USER: rfb_provenance
      POSTGRES_PASSWORD_FILE: /run/secrets/provenance_db_password
    secrets: [provenance_db_password]
    volumes: [provenance-db-data:/var/lib/postgresql]
    networks: [provenance-db]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rfb_provenance -d rfb_provenance]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  files-web:
    image: remote-workspace-files-web
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/files/web/Dockerfile
    environment:
      FILES_APPS_ENABLED: "true"
    expose: ["8080"]
    depends_on:
      files-server: { condition: service_healthy }
      image-tools: { condition: service_healthy }
      text-editor: { condition: service_healthy }
      video-studio: { condition: service_healthy }
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-ingress
      traefik.http.routers.remote-workspace.rule: "Host(`${RWS_HOSTNAME:-${RFB_HOSTNAME:-files.internal.example}}`)"
      traefik.http.routers.remote-workspace.entrypoints: websecure
      traefik.http.routers.remote-workspace.tls: "true"
      traefik.http.routers.remote-workspace.service: remote-workspace
      traefik.http.services.remote-workspace.loadbalancer.server.port: "8080"
    networks: [default, ingress]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  workspace-deps:
    image: node:24-bookworm-slim
    profiles: [dev]
    working_dir: /repo
    command: [npm, ci]
    volumes:
      - .:/repo
      - workspace-dev-node-modules:/repo/node_modules
    security_opt: [no-new-privileges:true]

  files-web-dev:
    image: node:24-bookworm-slim
    profiles: [dev]
    working_dir: /repo
    command: [npm, run, dev:files]
    environment:
      VITE_PROXY_TARGET: http://files-server:8080
      VITE_TEXT_EDITOR_TARGET: http://text-editor-dev:5173
      VITE_IMAGE_TOOLS_TARGET: http://image-tools-dev:5173
      VITE_VIDEO_STUDIO_TARGET: http://video-studio-dev:5173
      CHOKIDAR_USEPOLLING: "${RWS_DEV_POLLING:-${RFB_DEV_POLLING:-false}}"
    volumes:
      - .:/repo
      - workspace-dev-node-modules:/repo/node_modules
    ports: ["${RWS_BIND_ADDRESS:-${RFB_BIND_ADDRESS:-0.0.0.0}}:${RWS_DEV_PORT:-${RFB_DEV_PORT:-5173}}:5173"]
    depends_on:
      files-server: { condition: service_healthy }
      workspace-deps: { condition: service_completed_successfully }
      image-tools-dev: { condition: service_started }
      text-editor-dev: { condition: service_started }
      video-studio-dev: { condition: service_started }
    security_opt: [no-new-privileges:true]

  text-editor:
    image: remote-workspace-text-editor
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/text-editor/Dockerfile
    expose: ["8080"]
    read_only: true
    tmpfs: [/var/cache/nginx:size=16m,mode=0755, /var/run:size=1m,mode=0755]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  text-editor-dev:
    image: node:24-bookworm-slim
    profiles: [dev]
    working_dir: /repo
    command: [npm, run, dev:text]
    environment:
      VITE_FILES_TARGET: http://files-server:8080
    volumes:
      - .:/repo
      - workspace-dev-node-modules:/repo/node_modules
    depends_on:
      workspace-deps: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]

  image-tools:
    image: remote-workspace-image-tools
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/image-tools/Dockerfile
    expose: ["8080"]
    read_only: true
    tmpfs: [/var/cache/nginx:size=16m,mode=0755, /var/run:size=1m,mode=0755]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  image-tools-dev:
    image: node:24-bookworm-slim
    profiles: [dev]
    working_dir: /repo
    command: [npm, run, dev:images]
    environment:
      VITE_FILES_TARGET: http://files-server:8080
    volumes:
      - .:/repo
      - workspace-dev-node-modules:/repo/node_modules
    depends_on:
      workspace-deps: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]

  video-studio:
    image: remote-workspace-video-studio
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/video-studio/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      VIDEO_STUDIO_HOST: 0.0.0.0
      VIDEO_STUDIO_PORT: 4317
      VIDEO_STUDIO_DATA_DIR: /data
      FILES_API_INTERNAL_URL: http://files-server:8080/api/v1
      VIDEO_STUDIO_ALLOWED_ORIGINS: "${VIDEO_STUDIO_ALLOWED_ORIGINS:-${VFX_EDITOR_ALLOWED_ORIGINS:-https://${RWS_HOSTNAME:-${RFB_HOSTNAME:-files.internal.example}}}}"
    expose: ["4317"]
    networks:
      default: { aliases: [video-studio] }
    volumes: [video-studio-prod-data:/data]
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  video-studio-dev:
    image: remote-workspace-video-studio-dev
    profiles: [dev]
    build:
      context: .
      dockerfile: apps/video-studio/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      VIDEO_STUDIO_HOST: 0.0.0.0
      VIDEO_STUDIO_PORT: 4317
      VIDEO_STUDIO_DATA_DIR: /data
      CHOKIDAR_USEPOLLING: "${RWS_DEV_POLLING:-${RFB_DEV_POLLING:-true}}"
    networks:
      default: { aliases: [video-studio] }
    volumes:
      - .:/repo
      - workspace-dev-node-modules:/repo/node_modules
      - video-studio-dev-data:/data
    depends_on:
      workspace-deps: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]

  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    profiles: [prod]
    environment: { CONTAINERS: "1", EVENTS: "1", PING: "1", VERSION: "1", POST: "0", LOG_LEVEL: warning }
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks: [docker-api]
    read_only: true
    tmpfs: [/tmp:size=4m,mode=1777, /run:size=1m,mode=0755, /var/lib/haproxy:size=1m,mode=0755]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:2375/_ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ingress:
    image: traefik:v3.6.25
    profiles: [prod]
    command:
      - --api.dashboard=false
      - --global.checknewversion=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-ingress
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=${INGRESS_LOG_LEVEL:-${TRAEFIK_LOG_LEVEL:-INFO}}
      - --accesslog=true
    ports:
      - "${INGRESS_BIND_ADDRESS:-${TRAEFIK_BIND_ADDRESS:-127.0.0.1}}:80:80"
      - "${INGRESS_BIND_ADDRESS:-${TRAEFIK_BIND_ADDRESS:-127.0.0.1}}:443:443"
    volumes:
      - ./apps/ingress/dynamic:/etc/traefik/dynamic:ro
      - type: bind
        source: "${INGRESS_TLS_CERT_PATH:-${TRAEFIK_TLS_CERT_PATH:-/etc/ssl/private/internal-fullchain.pem}}"
        target: /run/tls/tls.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: "${INGRESS_TLS_KEY_PATH:-${TRAEFIK_TLS_KEY_PATH:-/etc/ssl/private/internal-key.pem}}"
        target: /run/tls/tls.key
        read_only: true
        bind: { create_host_path: false }
    networks: [docker-api, ingress]
    depends_on:
      socket-proxy: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8082/ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  workspace-dev-node-modules:
  provenance-db-data:
    name: remote-file-browser_provenance-db-data
  video-studio-dev-data:
    name: vfx-editor-dev-data
  video-studio-prod-data:
    name: vfx-editor-prod-data

networks:
  provenance-api: { internal: true }
  provenance-db: { internal: true }
  docker-api: { internal: true }
  ingress:
    name: traefik-ingress

secrets:
  admin_password:
    file: "${FILES_ADMIN_PASSWORD_PATH:-${RFB_ADMIN_PASSWORD_PATH:-./secrets/admin_password}}"
  provenance_db_password:
    file: "${FILES_PROVENANCE_DB_PASSWORD_PATH:-${RFB_PROVENANCE_DB_PASSWORD_PATH:-./secrets/provenance_db_password}}"
