name: remote-file-browser

services:
  backend:
    image: rfb-backend
    container_name: rfb-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        FFMPEG_VERSION: "8.1.2"
        FFMPEG_SHA256: "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"
    user: "${RFB_UID:-1000}:${RFB_GID:-1000}"
    working_dir: /fs-root
    environment:
      RFB_ROOT: /fs-root
      RFB_ADMIN_USERNAME: "${RFB_ADMIN_USERNAME:-admin}"
      RFB_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      RFB_SECURE_COOKIES: "${RFB_SECURE_COOKIES:-true}"
      RFB_CACHE_MAX_BYTES: "${RFB_CACHE_MAX_BYTES:-10737418240}"
      RFB_CACHE_MAX_AGE_DAYS: "${RFB_CACHE_MAX_AGE_DAYS:-30}"
      RFB_EDITOR_MAX_BYTES: "${RFB_EDITOR_MAX_BYTES:-5242880}"
      RFB_UPLOAD_MAX_BYTES: "${RFB_UPLOAD_MAX_BYTES:-21474836480}"
      RFB_TERMINAL_ENABLED: "${RFB_TERMINAL_ENABLED:-true}"
      RFB_TERMINAL_SHELL: "${RFB_TERMINAL_SHELL:-/bin/zsh}"
      RFB_TERMINAL_MAX_SESSIONS: "${RFB_TERMINAL_MAX_SESSIONS:-4}"
      RFB_PROVENANCE_API_URL: http://provenance-api:8090
      RUST_LOG: "${RUST_LOG:-remote_file_browser=info,tower_http=info}"
    volumes:
      - type: bind
        source: "${RFB_ROOT_PATH:-${HOME}}"
        target: /fs-root
        read_only: false
        bind:
          create_host_path: false
    secrets:
      - admin_password
    networks:
      - default
      - provenance-api
    depends_on:
      provenance-api:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/rfb-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  provenance-api:
    image: rfb-provenance-api
    container_name: rfb-provenance-api
    build:
      context: ./provenance-api
    environment:
      PROVENANCE_DB_HOST: provenance-db
      PROVENANCE_DB_NAME: rfb_provenance
      PROVENANCE_DB_USER: rfb_provenance
      PROVENANCE_DB_PASSWORD_FILE: /run/secrets/provenance_db_password
      RUST_LOG: "${RUST_LOG:-rfb_provenance_api=info}"
    secrets:
      - provenance_db_password
    networks:
      - provenance-api
      - provenance-db
    depends_on:
      provenance-db:
        condition: service_healthy
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  provenance-db:
    image: postgres:18.6-bookworm
    container_name: rfb-provenance-db
    environment:
      POSTGRES_DB: rfb_provenance
      POSTGRES_USER: rfb_provenance
      POSTGRES_PASSWORD_FILE: /run/secrets/provenance_db_password
    secrets:
      - provenance_db_password
    volumes:
      - provenance-db-data:/var/lib/postgresql
    networks:
      - provenance-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfb_provenance -d rfb_provenance"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: rfb-frontend
    container_name: rfb-frontend
    profiles: [prod]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      RFB_TLS_MODE: "${RFB_TLS_MODE:-https}"
      RFB_PUBLIC_HTTPS_PORT: "${RFB_HTTPS_PORT:-443}"
    volumes:
      - "${RFB_TLS_CERT_PATH:-./secrets/tls.crt}:/run/tls/tls.crt:ro"
      - "${RFB_TLS_KEY_PATH:-./secrets/tls.key}:/run/tls/tls.key:ro"
    ports:
      - "${RFB_BIND_ADDRESS:-0.0.0.0}:${RFB_HTTP_PORT:-80}:8080"
      - "${RFB_BIND_ADDRESS:-0.0.0.0}:${RFB_HTTPS_PORT:-443}:8443"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend-dev:
    image: node:24-bookworm-slim
    container_name: rfb-frontend-dev
    profiles: [dev]
    working_dir: /app
    command: ["sh", "-c", "npm ci && exec npm run dev"]
    environment:
      VITE_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "${RFB_DEV_POLLING:-false}"
    volumes:
      - ./frontend:/app
      - frontend-dev-node-modules:/app/node_modules
    ports:
      - "${RFB_BIND_ADDRESS:-0.0.0.0}:${RFB_DEV_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  frontend-dev-node-modules:
  provenance-db-data:

networks:
  provenance-api:
    internal: true
  provenance-db:
    internal: true

secrets:
  admin_password:
    file: "${RFB_ADMIN_PASSWORD_PATH:-./secrets/admin_password}"
  provenance_db_password:
    file: "${RFB_PROVENANCE_DB_PASSWORD_PATH:-./secrets/provenance_db_password}"
