name: traefik-ingress

services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - docker-api
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /run:size=1m,mode=0755
      - /var/lib/haproxy:size=1m,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:2375/_ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  traefik:
    image: traefik:v3.6.25
    command:
      - --api.dashboard=false
      - --global.checknewversion=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-ingress
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "${TRAEFIK_BIND_ADDRESS:?Set TRAEFIK_BIND_ADDRESS}:80:80"
      - "${TRAEFIK_BIND_ADDRESS:?Set TRAEFIK_BIND_ADDRESS}:443:443"
    volumes:
      - type: bind
        source: ./dynamic
        target: /etc/traefik/dynamic
        read_only: true
      - type: bind
        source: "${TRAEFIK_TLS_CERT_PATH:?Set TRAEFIK_TLS_CERT_PATH}"
        target: /run/tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TRAEFIK_TLS_KEY_PATH:?Set TRAEFIK_TLS_KEY_PATH}"
        target: /run/tls/tls.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - docker-api
      - ingress
    depends_on:
      socket-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add:
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8082/ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  docker-api:
    internal: true
  ingress:
    external: true
    name: traefik-ingress
