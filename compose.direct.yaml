services:
  frontend:
    environment:
      RFB_TLS_MODE: https
      RFB_PUBLIC_HTTPS_PORT: "${RFB_HTTPS_PORT:-443}"
    volumes:
      - type: bind
        source: "${RFB_TLS_CERT_PATH:?Set RFB_TLS_CERT_PATH}"
        target: /run/tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RFB_TLS_KEY_PATH:?Set RFB_TLS_KEY_PATH}"
        target: /run/tls/tls.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${RFB_BIND_ADDRESS:-0.0.0.0}:${RFB_HTTP_PORT:-80}:8080"
      - "${RFB_BIND_ADDRESS:-0.0.0.0}:${RFB_HTTPS_PORT:-443}:8443"
